  <text font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="650" y="495.25">The checker fails when</tspan><tspan x="650" y="512.75">- an Accepted/Implemented criterion has no tagged test</tspan><tspan x="650" y="530.25">- a tag names a criterion no spec defines (typo, deleted AC)</tspan><tspan x="650" y="547.75">- the PR body has no Spec: line</tspan><tspan x="650" y="565.25">Draft specs only warn. IDs are never reused or reordered.</tspan></text>
