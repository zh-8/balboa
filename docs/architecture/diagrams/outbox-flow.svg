  <rect x="-24" y="-74" width="1175" height="808" fill="#ffffff"/>
  <text font-family="Helvetica, Arial, sans-serif" font-size="24" text-anchor="start" fill="#1e1e1e"><tspan x="0" y="-26">Transactional outbox and inbox</tspan></text>
  <text font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#495057"><tspan x="0" y="-6">Integration events leave a module only if the change commits; handling is idempotent.</tspan></text>
  <rect x="0" y="60" width="210" height="90" rx="12" fill="#dbe4ff" stroke="#1864ab" stroke-width="2"/>
  <text font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="105" y="91">1  Command</tspan><tspan x="105" y="111">API endpoint to</tspan><tspan x="105" y="131">command handler</tspan></text>
  <rect x="260" y="20" width="800" height="200" rx="12" fill="none" stroke="#2b8a3e" stroke-width="1" stroke-dasharray="4 3"/>
  <text font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#2b8a3e"><tspan x="272" y="42">One database transaction (the module's DbContext)</tspan></text>
  <rect x="280" y="60" width="200" height="90" rx="12" fill="#dbe4ff" stroke="#1864ab" stroke-width="2"/>
  <text font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="380" y="91">2  Aggregate</tspan><tspan x="380" y="111">enforces invariants,</tspan><tspan x="380" y="131">raises events</tspan></text>
  <rect x="540" y="60" width="220" height="90" rx="12" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/>
  <text font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="650" y="91">3  Write state +</tspan><tspan x="650" y="111">OUTBOX row</tspan><tspan x="650" y="131">(same transaction)</tspan></text>
  <rect x="820" y="60" width="220" height="90" rx="12" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
  <text font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="930" y="101">4  COMMIT</tspan><tspan x="930" y="121">both rows or neither</tspan></text>
  <text font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#1e1e1e"><tspan x="280" y="185">Domain events stay inside the module and dispatch BEFORE commit.</tspan></text>
