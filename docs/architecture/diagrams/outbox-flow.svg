  <text font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="520" y="652.75">Startup sweep: every host start re-publishes outbox rows that were committed but never delivered</tspan><tspan x="520" y="670.25">(crash between commit and dispatch). Scale-to-zero means a background poller cannot be relied on.</tspan><tspan x="520" y="687.75">Delivery is at-least-once; the inbox makes the effect exactly-once.</tspan></text>
