  <rect x="540" y="300" width="220" height="100" rx="12" fill="#e5dbff" stroke="#5f3dc4" stroke-width="2"/>
  <text font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="650" y="336">6  Subscriber INBOX</tspan><tspan x="650" y="356">have I handled this</tspan><tspan x="650" y="376">message id already?</tspan></text>
