# Pull-request gate.
#
# Path-filtered so a docs-only change does not wait for Testcontainers. Every job
# funnels into `ci-ok`, which is the ONLY required status check in the branch
# ruleset — adding a job here never needs a ruleset change.
#
# NO AZURE LOGIN HERE. This repository is public, so a PR from a fork must never
# be able to reach a cloud credential. Bicep is only built and linted; `what-if`
# runs in main.yml, inside a protected environment.

name: CI

on:
  pull_request:
    branches: [main]
  merge_group:

# Top-level deny; each job opts in to what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Makefile'
              - 'global.json'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - '.github/workflows/**'
            docs:
              - 'docs/**'
              - '**/*.md'
              - 'tools/**'

  # ---------------------------------------------------------------------------
  pr-title:
    name: PR title is a conventional commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            test
            refactor
            ci
            infra
            perf
            revert
          requireScope: false

  # ---------------------------------------------------------------------------
  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      - name: Restore
        run: dotnet restore backend/Balboa.slnx

      - name: Formatting
        run: dotnet format backend/Balboa.slnx --verify-no-changes

      # Analyzers are errors (Directory.Build.props), so the build is the linter.
      - name: Build
        run: dotnet build backend/Balboa.slnx --no-restore -c Release

      # Architecture tests enforce the module boundaries. They are cheap and the
      # most likely thing to catch a design mistake, so they run before the
      # slower suites.
      - name: Architecture tests
        run: make test-arch

      - name: Unit tests + coverage
        run: make coverage

      # Needs Docker for Testcontainers; ubuntu-latest has it.
      - name: Integration tests
        run: make test-int

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/report/SummaryGithub.md ]; then
            cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results
          path: |
            coverage/
            **/TestResults/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Format check
        working-directory: frontend
        run: npm run format:check

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Sheriff enforces the frontend module boundaries, mirroring the backend
      # architecture tests.
      - name: Module boundaries
        working-directory: frontend
        run: npm run lint:boundaries

      - name: Test
        working-directory: frontend
        run: npm run test -- --run

      - name: Build
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------------
  infra:
    name: Infrastructure
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bicep build + lint
        run: |
          az bicep version
          make infra-lint

      - name: Shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck infra/bootstrap/*.sh infra/scripts/*.sh

      - name: Workflow and ruleset JSON/YAML is well formed
        run: |
          python3 -c "
          import json,glob,sys
          for f in glob.glob('infra/**/*.json', recursive=True):
              json.load(open(f)); print('ok', f)
          "

  # ---------------------------------------------------------------------------
  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            !**/node_modules/**

      # Spec-to-test traceability: every acceptance criterion needs a tagged
      # test, and every tag must name a criterion that exists.
      - name: Spec traceability
        run: make spec-check

      # Compares a source-hash marker embedded in each exported SVG against the
      # .excalidraw source, so a stale diagram fails without rendering anything.
      - name: Diagrams are up to date
        run: make diagrams-check

      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --max-concurrency 4 './**/*.md'
          fail: true

  # ---------------------------------------------------------------------------
  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # ---------------------------------------------------------------------------
  # The single required check.
  #
  # `needs` makes it wait for everything; the `if: always()` plus the explicit
  # result test makes a SKIPPED job pass (path filters skip jobs legitimately)
  # while a FAILED or CANCELLED job fails. Without the explicit check, a skipped
  # dependency would let the gate pass by default.
  ci-ok:
    name: ci-ok
    needs: [changes, pr-title, backend, frontend, infra, docs, security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no job failed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Job results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job reported '$r'"; exit 1 ;;
            esac
          done
          echo "All required jobs passed or were legitimately skipped."
