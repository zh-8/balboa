# Link checking for Markdown.
#
# Catches rotted external links and broken relative paths between docs, which is
# the most common form of documentation decay.

# Be polite to the sites we check, and do not let a slow host fail the build.
max_concurrency = 4
timeout = 20
max_retries = 2

# Treat these as success. 403 and 429 are what rate limiters and bot blockers
# return to CI; they say nothing about whether the link works in a browser.
accept = [200, 203, 204, 206, 403, 429]

# Some hosts reject HEAD outright.
method = "get"

exclude_path = [
  "node_modules",
  "dist",
  "bin",
  "obj",
]

exclude = [
  # The repository is not public yet, and self-referential links to it would
  # 404 until it is. Remove this entry once zh-8/balboa exists.
  "^https://github\\.com/zh-8/balboa",

  # Azure portal and tenant-specific URLs require a session; checking them
  # proves nothing.
  "^https://portal\\.azure\\.com",

  # Hosts that are not deployed yet (Phase B). Remove each as it goes live.
  "^https://(dev\\.)?balboa\\.cairobits\\.com",
  "^https://api\\.(dev\\.)?balboa\\.cairobits\\.com",

  # Example and placeholder hosts that are not meant to resolve.
  "example\\.com",
  "localhost",
  "127\\.0\\.0\\.1",
]

# Diagram SVGs are generated by `make diagrams` and are not committed until the
# first export. `make diagrams-check` is what guarantees they exist and are
# current, so lychee does not need to duplicate that and fail a docs-only PR.
exclude_file = ".lycheeignore"
